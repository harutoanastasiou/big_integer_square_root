[project]
name = "big-integer-square-root"
version = "0.1.0"
description = "Computes the integer floor of the square root of an arbitrarily large integer using Newton's method with exact division."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
